name: Daily Stock Data Collection

# 建议把这个仓库设为【公开】仓库，专门只放数据，不放网页本身。
# 公开仓库的 Actions 分钟数不限量，全市场规模每天跑不用担心额度。
# 网页仓库继续保持私密 + Cloudflare Access，通过 raw.githubusercontent.com
# 读这个仓库里的 data/stocks/*.json 即可，跨仓库没问题。
#
# 主力方案改成用 baostock（Python，专门给量化用的批量数据接口），
# 因为东财那个给个人看盘小组件用的接口，实测超过约17次请求就会被限制，
# 不适合批量抓全市场。scripts/fetch-daily.mjs（Node+东财）先留着当备用，
# 如果 baostock 这条路也不顺，可以把下面"抓取当日行情"那一步换回去。

on:
  schedule:
    # UTC 07:35 = 北京时间 15:35，A股收盘后留了半小时缓冲
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '(备用Node方案专用) 测试模式：只抓前N只'
        required: false
        default: ''
      diagnose:
        description: '(备用Node方案专用) 诊断模式'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 脚本内部预算是12分钟，这里留够缓冲；防止哪次卡死了长时间占着队列
    steps:
      - uses: actions/checkout@v4

      - name: 配置git身份
        run: |
          git config user.name "daily-data-bot"
          git config user.email "actions@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 baostock
        run: pip install baostock

      - name: 抓取当日行情（baostock，脚本内部会自己分批提交）
        run: python scripts/fetch-daily-baostock.py

      - name: 兜底提交（防止脚本内部提交没覆盖到的零星改动）
        if: always()
        run: |
          git add data/
          git diff --staged --quiet || git commit -m "daily data $(date -u +%Y-%m-%d) final"
          git fetch origin main
          git merge origin/main --no-edit -X ours -m "merge remote changes, prefer freshly collected data" || true
          git push || true
