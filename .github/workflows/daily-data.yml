name: Daily Stock Data Collection

# 建议把这个仓库设为【公开】仓库，专门只放数据，不放网页本身。
# 公开仓库的 Actions 分钟数不限量，全市场规模每天跑不用担心额度。
# 网页仓库继续保持私密 + Cloudflare Access，通过 raw.githubusercontent.com
# 读这个仓库里的 data/stocks/*.json 即可，跨仓库没问题。

on:
  schedule:
    # UTC 07:35 = 北京时间 15:35，A股收盘（15:00）后留了半小时缓冲
    - cron: 35 7 * * 1-5
  workflow_dispatch:
    inputs:
      limit:
        description: '测试模式：只抓前N只股票（留空=全市场）'
        required: false
        default: ''

permissions:
  contents: write

# 同一时间只允许一个在跑，新触发的会排队等上一个跑完，不会互相冲突
concurrency:
  group: daily-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取当日行情
        env:
          FETCH_LIMIT: ${{ github.event.inputs.limit }}
        run: node scripts/fetch-daily.mjs

      - name: 提交更新
        run: |
          git config user.name "daily-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "daily data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push
